<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Igor Massaro — vibe coder, analista de sistemas">
  <title>Igor Massaro — vibe coder</title>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3fb950"/>
      <stop offset="55%"  stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none } }
    </style>
  </defs>

  <rect width="1000" height="190" rx="6" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="189" rx="6" fill="none" stroke="#30363d"/>

  <!-- window dots -->
  <g>
    <circle cx="30" cy="28" r="5" fill="#30363d"/>
    <circle cx="48" cy="28" r="5" fill="#30363d"/>
    <circle cx="66" cy="28" r="5" fill="#30363d"/>
  </g>
  <line x1="0" y1="52" x2="1000" y2="52" stroke="#30363d"/>

  <g class="mono">
    <text x="30" y="102" font-size="34" font-weight="600" fill="#e6edf3" letter-spacing="1">igor massaro</text>
    <text x="30" y="136" font-size="16" fill="#7d8590">
      <tspan fill="#3fb950">$</tspan> <tspan fill="#58a6ff">vibe</tspan> code --ship<tspan class="caret" fill="#e6edf3">▌</tspan>
    </text>
    <text x="30" y="166" font-size="12.5" fill="#6e7681" letter-spacing="0.4">analista de sistemas · 10+ anos · pós em engenharia de IA</text>
  </g>

  <rect x="30" y="112" width="150" height="2" fill="url(#rule)" opacity="0.55"/>
</svg>
