<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 208" width="1000" height="208" role="img" aria-label="Stack: C#, .NET, WinUI 3, Python, JavaScript, HTML e CSS, Windows API, PowerShell, Git, Claude Code, agentes de IA, automação">
  <title>Stack e ferramentas</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#0d0718"/>
    </linearGradient>
    <pattern id="sgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#00f0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="sglow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .chip { animation: fade 4s ease-in-out infinite; }
      @keyframes fade { 0%,100% { opacity: .82 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .chip { animation: none; opacity: .95 } }
    </style>
  </defs>

  <rect width="1000" height="208" fill="url(#sbg)"/>
  <rect width="1000" height="208" fill="url(#sgrid)"/>
  <rect x="1" y="1" width="998" height="206" fill="none" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- ROW 1 : desenvolvimento -->
  <g class="mono">
    <text x="40" y="42" font-size="11" letter-spacing="2.4" fill="#00f0ff" fill-opacity="0.75">// DESENVOLVIMENTO</text>
  </g>
  <g class="mono chip" font-size="13" letter-spacing="1.2" style="animation-delay:0s">
    <g><rect x="246" y="56" width="44" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="268" y="74.5" fill="#a8f4ff" text-anchor="middle">C#</text></g>
    <g><rect x="300" y="56" width="59" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="329.5" y="74.5" fill="#a8f4ff" text-anchor="middle">.NET</text></g>
    <g><rect x="369" y="56" width="83" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="410.5" y="74.5" fill="#a8f4ff" text-anchor="middle">WinUI 3</text></g>
    <g><rect x="462" y="56" width="75" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="499.5" y="74.5" fill="#a8f4ff" text-anchor="middle">Python</text></g>
    <g><rect x="547" y="56" width="106" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="600" y="74.5" fill="#a8f4ff" text-anchor="middle">JavaScript</text></g>
    <g><rect x="663" y="56" width="90" height="28" rx="4" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.55"/><text x="708" y="74.5" fill="#a8f4ff" text-anchor="middle">HTML/CSS</text></g>
  </g>

  <!-- ROW 2 : plataforma -->
  <g class="mono">
    <text x="40" y="112" font-size="11" letter-spacing="2.4" fill="#7b5cff" fill-opacity="0.8">// PLATAFORMA</text>
  </g>
  <g class="mono chip" font-size="13" letter-spacing="1.2" style="animation-delay:1.3s">
    <g><rect x="354" y="98" width="114" height="28" rx="4" fill="#7b5cff" fill-opacity="0.08" stroke="#7b5cff" stroke-opacity="0.6"/><text x="411" y="116.5" fill="#cdbcff" text-anchor="middle">Windows API</text></g>
    <g><rect x="478" y="98" width="106" height="28" rx="4" fill="#7b5cff" fill-opacity="0.08" stroke="#7b5cff" stroke-opacity="0.6"/><text x="531" y="116.5" fill="#cdbcff" text-anchor="middle">PowerShell</text></g>
    <g><rect x="594" y="98" width="51" height="28" rx="4" fill="#7b5cff" fill-opacity="0.08" stroke="#7b5cff" stroke-opacity="0.6"/><text x="619.5" y="116.5" fill="#cdbcff" text-anchor="middle">Git</text></g>
  </g>

  <!-- ROW 3 : IA -->
  <g class="mono">
    <text x="40" y="182" font-size="11" letter-spacing="2.4" fill="#ff2e97" fill-opacity="0.8">// IA &amp; AGENTES</text>
  </g>
  <g class="mono chip" font-size="13" letter-spacing="1.2" style="animation-delay:2.6s">
    <g><rect x="319" y="168" width="114" height="28" rx="4" fill="#ff2e97" fill-opacity="0.08" stroke="#ff2e97" stroke-opacity="0.6"/><text x="376" y="186.5" fill="#ffb3d9" text-anchor="middle">Claude Code</text></g>
    <g><rect x="443" y="168" width="129" height="28" rx="4" fill="#ff2e97" fill-opacity="0.08" stroke="#ff2e97" stroke-opacity="0.6"/><text x="507.5" y="186.5" fill="#ffb3d9" text-anchor="middle">Agentes de IA</text></g>
    <g><rect x="582" y="168" width="98" height="28" rx="4" fill="#ff2e97" fill-opacity="0.08" stroke="#ff2e97" stroke-opacity="0.6"/><text x="631" y="186.5" fill="#ffb3d9" text-anchor="middle">Automação</text></g>
  </g>

  <!-- side accents -->
  <rect x="24" y="56" width="2" height="28" fill="#00f0ff" filter="url(#sglow)"/>
  <rect x="24" y="98" width="2" height="28" fill="#7b5cff" filter="url(#sglow)"/>
  <rect x="24" y="168" width="2" height="28" fill="#ff2e97" filter="url(#sglow)"/>
</svg>
