<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Igor Massaro — Analista de Sistemas e construtor com agentes de IA">
  <title>Igor Massaro — Analista de Sistemas // AI Builder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="55%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#12061a"/>
    </linearGradient>

    <linearGradient id="cyanmag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#ff2e97"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.28"/>
    </pattern>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

      .gl-r { animation: glr 5.2s infinite steps(1); }
      .gl-c { animation: glc 5.2s infinite steps(1); }
      @keyframes glr {
        0%,  6%   { transform: translate(0,0);      opacity: 0; }
        6.5%      { transform: translate(-4px,-2px); opacity: .85; }
        8%        { transform: translate(3px,1px);   opacity: .85; }
        9.5%      { transform: translate(0,0);       opacity: 0; }
        46%       { transform: translate(0,0);       opacity: 0; }
        47%       { transform: translate(5px,2px);   opacity: .8; }
        48.5%     { transform: translate(-2px,-1px); opacity: .8; }
        50%,100%  { transform: translate(0,0);       opacity: 0; }
      }
      @keyframes glc {
        0%,  6%   { transform: translate(0,0);       opacity: 0; }
        6.5%      { transform: translate(4px,2px);   opacity: .85; }
        8%        { transform: translate(-3px,-1px); opacity: .85; }
        9.5%      { transform: translate(0,0);       opacity: 0; }
        46%       { transform: translate(0,0);       opacity: 0; }
        47%       { transform: translate(-5px,-2px); opacity: .8; }
        48.5%     { transform: translate(2px,1px);   opacity: .8; }
        50%,100%  { transform: translate(0,0);       opacity: 0; }
      }

      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      .beam { animation: sweep 6.5s linear infinite; }
      @keyframes sweep { 0% { transform: translateY(-10px) } 100% { transform: translateY(290px) } }

      .pulse { animation: pl 2.6s ease-in-out infinite; }
      @keyframes pl { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

      @media (prefers-reduced-motion: reduce) {
        .gl-r, .gl-c, .caret, .beam, .pulse { animation: none; }
        .gl-r, .gl-c { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- horizon glow -->
  <ellipse cx="500" cy="292" rx="440" ry="70" fill="#7b5cff" fill-opacity="0.16" filter="url(#glow)"/>

  <!-- corner brackets -->
  <path d="M28 26 L28 74 M28 26 L86 26" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M972 254 L972 206 M972 254 L914 254" fill="none" stroke="#ff2e97" stroke-width="2" stroke-opacity="0.9"/>

  <!-- top status strip -->
  <g class="mono" font-size="11" letter-spacing="2.5">
    <circle cx="112" cy="22" r="3.2" fill="#00ff9d" class="pulse"/>
    <text x="124" y="26" fill="#00ff9d" fill-opacity="0.85">SYS::ONLINE</text>
    <text x="972" y="26" fill="#ff2e97" fill-opacity="0.7" text-anchor="end">SP // BR</text>
  </g>

  <!-- name + glitch layers -->
  <g class="mono" font-size="62" font-weight="700" letter-spacing="6" text-anchor="middle">
    <text class="gl-c" x="500" y="140" fill="#00f0ff" fill-opacity="0.9">IGOR MASSARO</text>
    <text class="gl-r" x="500" y="140" fill="#ff2e97" fill-opacity="0.9">IGOR MASSARO</text>
    <text x="500" y="140" fill="#f2f5ff" filter="url(#softglow)">IGOR MASSARO</text>
  </g>

  <!-- gradient rule -->
  <rect x="230" y="164" width="540" height="2" fill="url(#cyanmag)" filter="url(#softglow)"/>

  <!-- subtitle -->
  <g class="mono" font-size="17" letter-spacing="2.2" text-anchor="middle">
    <text x="500" y="202" fill="#8ef7ff">
      <tspan fill="#ff2e97">&gt;</tspan> ANALISTA DE SISTEMAS <tspan fill="#7b5cff">//</tspan> AI BUILDER<tspan class="caret" fill="#00f0ff">_</tspan>
    </text>
  </g>

  <!-- bottom meta -->
  <g class="mono" font-size="11.5" letter-spacing="2" text-anchor="middle">
    <text x="500" y="238" fill="#5b6480">10+ ANOS EM SUPORTE E SISTEMAS &#183; P&#211;S EM ENGENHARIA DE IA</text>
  </g>

  <!-- scan beam -->
  <rect class="beam" x="0" y="0" width="1000" height="2.5" fill="url(#beam)"/>
  <rect width="1000" height="280" fill="url(#scan)"/>
  <rect x="1" y="1" width="998" height="278" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
